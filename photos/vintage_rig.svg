<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#008080" />
  <!-- CRT Monitor Case -->
  <rect x="50" y="60" width="300" height="230" rx="16" fill="#c0c0c0" stroke="#808080" stroke-width="4" />
  <rect x="54" y="64" width="292" height="222" rx="12" fill="#dfdfdf" />
  <!-- CRT Screen Bezel -->
  <rect x="75" y="80" width="250" height="180" rx="20" fill="#111111" />
  <rect x="85" y="90" width="230" height="160" rx="14" fill="#000080" />
  <!-- Screen Text -->
  <text x="100" y="130" font-family="'Courier New', monospace" font-size="14" fill="#ffffff">Microsoft Windows 95</text>
  <text x="100" y="160" font-family="'Courier New', monospace" font-size="12" fill="#dfdfdf">C:\&gt; WIN.COM</text>
  <text x="100" y="190" font-family="'Courier New', monospace" font-size="12" fill="#00ff00">Initializing memory...</text>
  <text x="100" y="210" font-family="'Courier New', monospace" font-size="12" fill="#ffff00">READY_</text>
  <!-- Monitor Stand -->
  <polygon points="160,290 240,290 260,330 140,330" fill="#a0a0a0" stroke="#808080" stroke-width="2" />
  <rect x="120" y="330" width="160" height="20" rx="6" fill="#c0c0c0" stroke="#808080" stroke-width="2" />
  <!-- Power LED -->
  <circle cx="310" cy="275" r="4" fill="#00ff00" />
  <!-- Power Button -->
  <rect x="270" y="271" width="16" height="8" rx="2" fill="#808080" />
</svg>
