<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#181425" />
  <!-- Pixel Art Cyber Skull / Robot -->
  <g shape-rendering="crispEdges">
    <!-- Neon framing -->
    <rect x="20" y="20" width="360" height="360" fill="none" stroke="#ff0055" stroke-width="6" />
    <rect x="30" y="30" width="340" height="340" fill="none" stroke="#00ffff" stroke-width="2" />
    <!-- Pixel art elements -->
    <rect x="120" y="80" width="160" height="140" fill="#fee761" />
    <rect x="100" y="120" width="200" height="80" fill="#fee761" />
    <!-- Eyes -->
    <rect x="130" y="130" width="40" height="40" fill="#181425" />
    <rect x="230" y="130" width="40" height="40" fill="#181425" />
    <rect x="140" y="140" width="20" height="20" fill="#ff0044" />
    <rect x="240" y="140" width="20" height="20" fill="#00e436" />
    <!-- Mouth -->
    <rect x="150" y="240" width="100" height="30" fill="#fee761" />
    <rect x="160" y="245" width="15" height="20" fill="#181425" />
    <rect x="185" y="245" width="15" height="20" fill="#181425" />
    <rect x="210" y="245" width="15" height="20" fill="#181425" />
    <rect x="235" y="245" width="10" height="20" fill="#181425" />
  </g>
  <text x="200" y="340" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00e436" text-anchor="middle">CYBER_SKULL_ART.PNG</text>
</svg>
